<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Analysis Hub</title>
  <meta name="description" content="Browse, filter, and open all your published data analysis reports from one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
  <style>
    /* ── FILTER BAR ──────────────────────────────────────── */
    .filter-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--surface); border-radius: var(--r-card);
      box-shadow: var(--shadow); border: 1px solid var(--border);
      padding: 14px 20px;
    }
    .filter-tabs { display: flex; gap: 4px; }
    .filter-tab {
      font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px;
      cursor: pointer; transition: background .15s, color .15s;
      color: var(--text-500); background: transparent; border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .filter-tab:hover   { background: var(--mint-100); color: var(--green-700); }
    .filter-tab.active  { background: var(--green-900); color: #fff; }
    .filter-spacer { flex: 1; }
    .filter-search {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 16px; font-size: 13px;
      color: var(--text-900); font-family: 'Plus Jakarta Sans', sans-serif; outline: none;
      width: 220px; transition: border-color .15s;
    }
    .filter-search:focus { border-color: var(--green-500); }
    .filter-search::placeholder { color: var(--text-400); }

    /* ── REPORTS GRID ────────────────────────────────────── */
    .reports-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
    @media (max-width: 1100px) { .reports-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 700px)  { .reports-grid { grid-template-columns: 1fr; } }
    .filter-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sort-select {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 14px; font-size: 13px;
      color: var(--text-900); font-family: 'Plus Jakarta Sans', sans-serif; outline: none;
      cursor: pointer; transition: border-color .15s;
    }
    .sort-select:focus { border-color: var(--green-500); }
    @media (max-width: 600px)  {
      .filter-bar { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
      .filter-tabs { width: 100%; overflow-x: auto; padding-bottom: 4px; }
      .filter-controls { width: 100%; flex-direction: column; gap: 8px; }
      .filter-search, .sort-select { width: 100%; }
    }

    .report-card { display: flex; flex-direction: column; gap: 0; }
    .rc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cat-pill {
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    }
    .rc-title   { font-size: 16px; font-weight: 700; color: var(--text-900); margin-bottom: 6px; }
    .rc-desc    { font-size: 13px; color: var(--text-500); line-height: 1.5; margin-bottom: 16px; flex: 1; }
    .rc-kpis    { display: flex; gap: 16px; margin-bottom: 16px; padding: 12px; background: var(--bg); border-radius: 12px; }
    .kpi        { display: flex; flex-direction: column; gap: 2px; }
    .kpi-num    { font-size: 18px; font-weight: 800; color: var(--text-900); font-variant-numeric: tabular-nums; }
    .kpi-label  { font-size: 11px; color: var(--text-400); font-weight: 500; }
    .rc-insights { margin-bottom: 16px; }
    .rc-insight-item { font-size: 12px; color: var(--text-500); padding: 4px 0; display: flex; gap: 6px; }
    .rc-insight-item::before { content: '-'; color: var(--green-500); font-weight: 700; flex-shrink: 0; }
    .rc-footer  { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }
    .rc-updated { font-size: 12px; color: var(--text-400); }
    .rc-actions { display: flex; gap: 8px; }
    .no-results { text-align: center; color: var(--text-400); padding: 48px; grid-column: 1/-1; font-size: 14px; }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo"><div class="logo-name">Analysis Hub</div><div class="logo-sub">Data Reports</div></div>
    <div class="nav-section">
      <p class="nav-eyebrow">Menu</p>
      <a href="index.html"     class="nav-item" id="nav-dashboard"><span class="nav-label">Dashboard</span></a>
      <a href="reports.html"   class="nav-item active" id="nav-reports">  <span class="nav-label">Reports</span><span class="nav-badge"></span></a>
      <a href="datasets.html"  class="nav-item" id="nav-datasets"> <span class="nav-label">Datasets</span></a>
      <a href="analytics.html" class="nav-item" id="nav-analytics"><span class="nav-label">Analytics</span></a>
    </div>
    <div class="sidebar-spacer"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search reports, datasets, tags&hellip;" />
        <span class="search-kbd">&#8984;F</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="user-chip">
        <div class="user-text"><span class="user-name">Yash Vasudeva</span><span class="user-email">yash@analysis.hub</span></div>
        <div class="user-avatar">YV</div>
      </div>
    </header>

    <div class="page-header">
      <div class="page-header-text">
        <h1>Reports</h1>
        <p>All published data analysis reports. Click to open any report.</p>
      </div>
    </div>

    <div class="content">
      <!-- Filter bar — counts injected by JS -->
      <div class="filter-bar">
        <div class="filter-tabs" id="filter-tabs"></div>
        <div class="filter-spacer"></div>
        <div class="filter-controls">
          <select class="sort-select" id="report-sort" aria-label="Sort reports">
            <option value="latest" selected>Latest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Title (A&ndash;Z)</option>
          </select>
          <input class="filter-search" id="report-search" placeholder="Filter by title&hellip;" />
        </div>
      </div>

      <!-- Reports grid -->
      <div class="reports-grid" id="reports-grid"></div>
    </div>
  </div>
</div>

<script src="reports-data.js"></script>
<script src="hub.js"></script>
<script>
/* ── BUILD FILTER TABS from live data ──────────────────── */
(function () {
  const s = HUB_STATS;
  const tabs = [
    { label: `All (${s.total})`,             filter: 'all'         },
    { label: `Completed (${s.completed})`,   filter: 'completed'   },
    { label: `In Progress (${s.inProgress})`,filter: 'in_progress' },
    { label: `Pending (${s.pending})`,       filter: 'pending'     }
  ];
  document.getElementById('filter-tabs').innerHTML = tabs.map((t, i) =>
    `<button class="filter-tab${i === 0 ? ' active' : ''}" data-filter="${t.filter}" data-target="reports-grid">${t.label}</button>`
  ).join('');
})();

/* ── RENDER REPORTS GRID ───────────────────────────────── */
function renderGrid(data) {
  const grid = document.getElementById('reports-grid');
  if (!data.length) {
    grid.innerHTML = '<p class="no-results">No reports match your filter.</p>'; return;
  }
  grid.innerHTML = data.map(r => `
    <div class="card report-card" data-status="${r.status}" data-search="${r.title} ${r.category} ${r.categoryLabel}">
      <div class="rc-header">
        <span class="cat-pill" style="background:${r.categoryColors.bg}; color:${r.categoryColors.text};">${r.categoryLabel}</span>
        <span class="badge ${bClass(r.status)}">${bText(r.status)}</span>
      </div>
      <div class="rc-title">${r.title}</div>
      <div class="rc-desc">${r.desc}</div>
      <div class="rc-kpis">
        ${r.kpis.map(k => `<div class="kpi"><span class="kpi-num">${k.value}</span><span class="kpi-label">${k.label}</span></div>`).join('')}
      </div>
      <div class="rc-insights">
        ${r.insights.map(i => `<div class="rc-insight-item">${i}</div>`).join('')}
      </div>
      <div class="rc-footer">
        <span class="rc-updated">Updated ${r.updated}</span>
        <div class="rc-actions">
          <a href="${r.url}" class="btn-primary btn-sm">Open Report</a>
        </div>
      </div>
    </div>`).join('');
}

function getSortedReports() {
  const sortMode = document.getElementById('report-sort')?.value || 'latest';
  const list = [...REPORTS];
  if (sortMode === 'latest') {
    list.sort((a, b) => new Date(b.updated || 0) - new Date(a.updated || 0));
  } else if (sortMode === 'oldest') {
    list.sort((a, b) => new Date(a.updated || 0) - new Date(b.updated || 0));
  } else if (sortMode === 'title') {
    list.sort((a, b) => a.title.localeCompare(b.title));
  }
  return list;
}

function applyFiltersAndSort() {
  const sorted = getSortedReports();
  renderGrid(sorted);

  const activeTab = document.querySelector('.filter-tab.active');
  const filter = activeTab ? activeTab.dataset.filter : 'all';
  const q = (document.getElementById('report-search')?.value || '').toLowerCase().trim();

  document.querySelectorAll('#reports-grid .report-card').forEach(c => {
    const statusMatch = filter === 'all' || c.dataset.status === filter;
    const searchMatch = q === '' || c.dataset.search.toLowerCase().includes(q);
    c.style.display = statusMatch && searchMatch ? '' : 'none';
  });
}

// Initial render (latest first)
applyFiltersAndSort();

/* ── LOCAL SEARCH & SORT ───────────────────────────────── */
document.getElementById('report-sort')?.addEventListener('change', applyFiltersAndSort);
document.getElementById('report-search')?.addEventListener('input', applyFiltersAndSort);
</script>
</body>
</html>
