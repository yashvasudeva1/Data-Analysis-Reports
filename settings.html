<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Analysis Hub</title>
  <meta name="description" content="Configure your Analysis Hub preferences and account settings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
  <style>
    .settings-layout { display: flex; gap: 30px; align-items: flex-start; }
    .settings-nav {
      width: 220px; flex-shrink: 0; background: var(--surface);
      border-radius: var(--r-card); box-shadow: var(--shadow);
      border: 1px solid var(--border); padding: 12px;
    }
    .settings-tab {
      display: block; width: 100%; text-align: left; padding: 10px 14px;
      font-size: 13.5px; font-weight: 600; color: var(--text-500);
      border-radius: 10px; cursor: pointer; transition: background .15s, color .15s;
      margin-bottom: 4px; border: none; background: transparent;
    }
    .settings-tab:hover:not(.active) { background: var(--bg); color: var(--text-900); }
    .settings-tab.active { background: var(--mint-100); color: var(--green-900); }
    
    .settings-content { flex: 1; min-width: 0; }
    .settings-panel { display: none; }
    .settings-panel.active { display: block; }
    
    @media (max-width: 800px) {
      .settings-layout { flex-direction: column; }
      .settings-nav { width: 100%; display: flex; overflow-x: auto; padding: 8px; }
      .settings-tab { width: auto; white-space: nowrap; margin: 0 4px 0 0; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo"><div class="logo-name">Analysis Hub</div><div class="logo-sub">Data Reports</div></div>
    <div class="nav-section">
      <p class="nav-eyebrow">Menu</p>
      <a href="index.html"     class="nav-item" id="nav-dashboard"><span class="nav-label">Dashboard</span></a>
      <a href="reports.html"   class="nav-item" id="nav-reports">  <span class="nav-label">Reports</span><span class="nav-badge">4</span></a>
      <a href="datasets.html"  class="nav-item" id="nav-datasets"> <span class="nav-label">Datasets</span></a>
      <a href="analytics.html" class="nav-item" id="nav-analytics"><span class="nav-label">Analytics</span></a>
    </div>
    <div class="sidebar-spacer"></div>
</nav>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search settings…" disabled style="opacity: 0.5" />
      </div>
      <div class="topbar-spacer"></div>
      <div class="user-chip">
        <div class="user-text"><span class="user-name">Yash Vasudeva</span><span class="user-email">yash@analysis.hub</span></div>
        <div class="user-avatar">YV</div>
      </div>
    </header>

    <div class="page-header">
      <div class="page-header-text">
        <h1>Settings</h1>
        <p>Manage your account and profile settings.</p>
      </div>
    </div>

    <div class="content">

      <div class="settings-layout">
        
        <!-- Settings Nav -->
        <div class="settings-nav">
          <button class="settings-tab active" data-panel="panel-profile">Profile</button>
          <button class="settings-tab" data-panel="panel-account">Account</button>
        </div>

        <!-- Settings Content -->
        <div class="settings-content">
          
          <!-- Profile Panel -->
          <div class="card settings-panel active" id="panel-profile">
            <h2 class="card-title" style="margin-bottom: 24px;">Profile Information</h2>
            
            <div style="display:flex; gap: 24px; align-items: center; margin-bottom: 32px;">
              <div class="user-avatar-circle" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--green-700), var(--green-500)); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #fff;">YV</div>
              <div>
                <button class="btn-outline btn-sm">Change Avatar</button>
                <div class="form-hint" style="margin-top: 8px;">JPG, GIF or PNG. Max size of 800K</div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" id="setting-name" value="Yash Vasudeva" />
              </div>
              <div class="form-group">
                <label class="form-label">Role / Title</label>
                <input type="text" class="form-input" id="setting-role" value="Data Analyst" />
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label">Bio</label>
              <textarea class="form-textarea" id="setting-bio">Analyzing crime, economic, and climate datasets. Building interactive reports and KPIs.</textarea>
              <div class="form-hint">Brief description for your profile. URLs are hyperlinked.</div>
            </div>

            <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
              <button class="btn-primary" onclick="alert('Profile saved successfully!')">Save Changes</button>
            </div>
          </div>

          <!-- Account Panel -->
          <div class="card settings-panel" id="panel-account">
             <h2 class="card-title" style="margin-bottom: 24px;">Account Settings</h2>
             
             <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="setting-email" value="yash@analysis.hub" />
              </div>
              
              <div class="form-group" style="margin-top: 30px;">
                <label class="form-label">Change Password</label>
                <input type="password" class="form-input" placeholder="Current password" style="margin-bottom: 12px;"/>
                <input type="password" class="form-input" placeholder="New password" />
              </div>

              <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <button class="btn-danger" onclick="confirm('Are you sure you want to delete your account? This cannot be undone.')">Delete Account</button>
                <button class="btn-primary" onclick="alert('Account settings updated!')">Update Account</button>
              </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="hub.js"></script>
</body>
</html>
