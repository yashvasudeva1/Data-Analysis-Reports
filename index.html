<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Analysis Hub</title>
  <meta name="description" content="Analysis Hub dashboard - overview of your data analysis reports, team activity, and upload statistics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
  <style>
    /* ── STAT ROW ─────────────────────────────────────────── */
    .stat-row    { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    .stat-pill   { display: inline-flex; align-items: center; gap: 5px; background: var(--mint-100); color: var(--green-text); font-size: 11.5px; font-weight: 500; padding: 4px 10px; border-radius: 999px; flex-wrap: wrap; }
    .stat-pill.neutral { background: var(--gray-bg); color: var(--gray-text); }
    .stat-card.hero { background: linear-gradient(140deg, var(--green-900) 0%, #1A6647 100%); border-color: transparent; position: relative; overflow: hidden; }
    .stat-card.hero::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.05); }
    .stat-card.hero::after  { content: ''; position: absolute; bottom: -20px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.04); }
    .stat-card.hero .stat-label  { color: rgba(255,255,255,.7); }
    .stat-card.hero .stat-number { color: #fff; }
    .stat-card.hero .stat-pill   { background: rgba(255,255,255,.15); color: rgba(255,255,255,.9); }

    /* ── ROW 2 ────────────────────────────────────────────── */
    .cards-row-2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

    /* Featured / CTA */
    .event-name { font-size: 16px; font-weight: 700; color: var(--text-900); margin: 10px 0 4px; }
    .event-meta { font-size: 12px; color: var(--text-400); margin-bottom: 20px; line-height: 1.5; }
    .cta-btn {
      display: flex; align-items: center; justify-content: center; width: 100%;
      background: var(--green-900); color: #fff; font-size: 13.5px; font-weight: 600;
      padding: 13px; border-radius: 14px; cursor: pointer; border: none;
      font-family: 'Plus Jakarta Sans', sans-serif; transition: background .15s, transform .1s;
      text-decoration: none; min-height: 48px;
    }
    .cta-btn:hover { background: var(--green-700); transform: translateY(-1px); }

    /* Report list */
    .report-row {
      display: flex; align-items: center; gap: 12px; padding: 11px 0;
      border-radius: 10px; transition: background .15s; cursor: pointer;
      text-decoration: none; color: inherit; min-height: 44px;
    }
    .report-row:hover { background: var(--bg); margin: 0 -6px; padding: 11px 6px; }
    .report-row + .report-row { border-top: 1px solid var(--border); }
    .report-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .report-info { flex: 1; min-width: 0; }
    .report-title-text { font-size: 13.5px; font-weight: 600; color: var(--text-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-date       { font-size: 11.5px; color: var(--text-400); margin-top: 1px; }

    /* ── ROW 3 ────────────────────────────────────────────── */
    .cards-row-3 { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 20px; }

    /* Category list */
    .cat-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 8px; }
    .cat-row:last-child { border-bottom: none; }
    .cat-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .cat-badge-sm { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex-shrink: 0; }
    .cat-title-text { font-size: 13px; font-weight: 600; color: var(--text-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Donut */
    .donut-wrap { position: relative; width: 130px; height: 130px; margin: 0 auto 16px; }
    .donut-wrap svg { transform: rotate(-90deg); }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .donut-pct     { font-size: 24px; font-weight: 800; color: var(--text-900); font-variant-numeric: tabular-nums; }
    .donut-caption { font-size: 10px; color: var(--text-400); font-weight: 500; }
    .donut-legend  { display: flex; flex-direction: column; gap: 7px; }
    .donut-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-500); }
    .legend-dot    { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* Live card */
    .live-card { background: var(--green-900); border-color: transparent; position: relative; overflow: hidden; }
    .live-card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(255,255,255,.025) 28px, rgba(255,255,255,.025) 29px),
                        repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(255,255,255,.025) 28px, rgba(255,255,255,.025) 29px);
    }
    .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.7); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-bottom: 12px; }
    .live-dot   { width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
    .live-title { font-size: 14px; font-weight: 700; color: rgba(255,255,255,.9); margin-bottom: 4px; }
    .live-file  { font-size: 11.5px; color: rgba(255,255,255,.45); margin-bottom: 18px; font-style: italic; }
    .live-prog-label { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,.5); margin-bottom: 6px; }
    .live-prog-bar   { height: 6px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
    .live-prog-fill  { height: 100%; width: 100%; background: linear-gradient(90deg, var(--green-500), var(--green-300)); border-radius: 999px; }
    .live-pct   { font-size: 38px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 16px; }
    .live-controls { display: flex; gap: 10px; }
    .live-btn { padding: 9px 18px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: 'Plus Jakarta Sans', sans-serif; transition: opacity .15s; min-height: 40px; }
    .live-btn:hover { opacity: .85; }
    .live-btn.pause { background: #fff; color: var(--green-900); }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 1300px) { .stat-row { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 1100px) { .cards-row-2 { grid-template-columns: 1fr; } }
    @media (max-width: 900px)  {
      .stat-row    { grid-template-columns: repeat(2, 1fr); }
      .cards-row-3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px)  {
      .stat-row { grid-template-columns: 1fr 1fr; gap: 12px; }
      .stat-card.hero { grid-column: 1 / -1; }
      .event-name { font-size: 15px; }
      .live-pct { font-size: 30px; }
    }
    @media (max-width: 420px)  { .stat-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-name">Analysis Hub</div>
      <div class="logo-sub">Data Reports</div>
    </div>
    <div class="nav-section">
      <p class="nav-eyebrow">Menu</p>
      <a href="index.html"     class="nav-item active" id="nav-dashboard"><span class="nav-label">Dashboard</span></a>
      <a href="reports.html"   class="nav-item" id="nav-reports"><span class="nav-label">Reports</span><span class="nav-badge"></span></a>
      <a href="datasets.html"  class="nav-item" id="nav-datasets"><span class="nav-label">Datasets</span></a>
      <a href="analytics.html" class="nav-item" id="nav-analytics"><span class="nav-label">Analytics</span></a>
    </div>
    <div class="sidebar-spacer"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search reports, datasets&hellip;" />
        <span class="search-kbd">&#8984;F</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="user-chip">
        <div class="user-text">
          <span class="user-name">Yash Vasudeva</span>
          <span class="user-email">yash@analysis.hub</span>
        </div>
        <div class="user-avatar">YV</div>
      </div>
    </header>

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="page-header-text">
        <h1>Dashboard</h1>
        <p>View, track, and compare your published data analysis reports.</p>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- STAT ROW -->
      <div class="stat-row" id="stat-row"></div>

      <!-- ROW 2 -->
      <div class="cards-row-2">

        <!-- Featured Report -->
        <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;" id="featured-card"></div>

        <!-- Published Reports list -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Published Reports</span>
            <a href="reports.html" class="btn-outline btn-sm">View All</a>
          </div>
          <div id="report-list"></div>
        </div>

        <!-- Primary Datasets -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Primary Datasets</span>
            <a href="datasets.html" class="btn-outline btn-sm">Manage</a>
          </div>
          <div id="dataset-list"></div>
        </div>

      </div>

      <!-- ROW 3 -->
      <div class="cards-row-3">

        <!-- Active Categories -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Active Categories</span>
            <a href="reports.html" class="btn-outline btn-sm">Explore</a>
          </div>
          <div id="category-list"></div>
        </div>

        <!-- Donut -->
        <div class="card" id="donut-card"></div>

        <!-- Live card -->
        <div class="card live-card" id="live-card"></div>
      </div>

    </div><!-- /content -->
  </div><!-- /main -->
</div><!-- /app-shell -->

<script src="reports-data.js"></script>
<script src="hub.js"></script>
<script>
/* ── STAT ROW ──────────────────────────────────────────── */
(function () {
  const s = HUB_STATS;
  document.getElementById('stat-row').innerHTML = `
    <div class="card stat-card hero">
      <div class="stat-label">Total Reports</div>
      <div class="stat-number">${s.total}</div>
      <div class="stat-pill">Active published reports</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">Completed Analyses</div>
      <div class="stat-number">${s.completed}</div>
      <div class="stat-pill">${s.completed === s.total ? 'All reports completed' : s.completed + ' of ' + s.total + ' completed'}</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">Active Datasets</div>
      <div class="stat-number">${s.total}</div>
      <div class="stat-pill">${REPORTS.map(r => r.categoryLabel).join(', ')}</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">Total Data Size</div>
      <div class="stat-number">${s.totalSizeLabel}</div>
      <div class="stat-pill">30+ CSV, TXT &amp; archives</div>
    </div>
    <div class="card stat-card">
      <div class="stat-label">Data Portals</div>
      <div class="stat-number">${s.portals.length}</div>
      <div class="stat-pill">${s.portals.join(', ')}</div>
    </div>
  `;
})();

/* ── FEATURED CARD ─────────────────────────────────────── */
(function () {
  const r = REPORTS[0];
  document.getElementById('featured-card').innerHTML = `
    <div>
      <div class="card-title" style="margin-bottom:6px">Featured Analysis</div>
      <div class="event-name" style="margin-top:4px">${r.title}</div>
      <div class="event-meta">${r.desc}</div>
    </div>
    <a href="${r.url}" class="cta-btn">Explore Report &rarr;</a>
  `;
})();

/* ── PUBLISHED REPORTS LIST ────────────────────────────── */
document.getElementById('report-list').innerHTML = REPORTS.map(r => {
  const tag   = r.url ? `<a href="${r.url}" class="report-row" data-search="${r.title} ${r.status} ${r.updated}">` : `<div class="report-row" data-search="${r.title} ${r.status} ${r.updated}">`;
  const close = r.url ? '</a>' : '</div>';
  return `${tag}
    <div class="report-dot" style="background:${r.color}"></div>
    <div class="report-info">
      <div class="report-title-text">${r.title}</div>
      <div class="report-date">Updated ${r.updated}</div>
    </div>
    <span class="badge ${bClass(r.status)}">${bText(r.status)}</span>
  ${close}`;
}).join('');

/* ── PRIMARY DATASETS LIST ─────────────────────────────── */
document.getElementById('dataset-list').innerHTML = REPORTS.map(r => {
  const d = r.dataset;
  return `
    <div class="cat-row" data-search="${r.title} ${r.categoryLabel} ${d.portal}">
      <div class="cat-info">
        <span class="cat-badge-sm" style="background:${r.categoryColors.bg}; color:${r.categoryColors.text};">${d.size}</span>
        <span class="cat-title-text">${d.name}</span>
      </div>
      <a href="${d.sourceUrl}" target="_blank" class="source-link" style="font-size:11.5px; flex-shrink:0;">${d.portal} &nearr;</a>
    </div>`;
}).join('');

/* ── ACTIVE CATEGORIES LIST ────────────────────────────── */
document.getElementById('category-list').innerHTML = REPORTS.map(r => `
  <div class="cat-row" data-search="${r.title} ${r.categoryLabel}">
    <div class="cat-info">
      <span class="cat-badge-sm" style="background:${r.categoryColors.bg}; color:${r.categoryColors.text};">${r.categoryLabel}</span>
      <span class="cat-title-text">${r.title}</span>
    </div>
    <span class="badge ${bClass(r.status)}" style="flex-shrink:0;">${bText(r.status)}</span>
  </div>`).join('');

/* ── DONUT CHART ───────────────────────────────────────── */
(function () {
  const s = HUB_STATS;
  const pct = s.total > 0 ? Math.round((s.completed / s.total) * 100) : 0;
  const radius = 50, circ = 2 * Math.PI * radius;
  const dash = (circ * pct / 100).toFixed(2);
  document.getElementById('donut-card').innerHTML = `
    <div class="card-title" style="margin-bottom:16px">Analysis Status</div>
    <div class="donut-wrap">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${radius}" fill="none" stroke="#ECEEED" stroke-width="14"/>
        <circle cx="65" cy="65" r="${radius}" fill="none" stroke="#0E3B2E" stroke-width="14"
          stroke-dasharray="${dash} ${(circ - parseFloat(dash)).toFixed(2)}"
          stroke-dashoffset="0" stroke-linecap="round"/>
      </svg>
      <div class="donut-center">
        <span class="donut-pct">${pct}%</span>
        <span class="donut-caption">Completed</span>
      </div>
    </div>
    <div class="donut-legend">
      <div class="donut-legend-item"><div class="legend-dot" style="background:var(--green-900)"></div>Completed (${s.completed})</div>
      <div class="donut-legend-item"><div class="legend-dot" style="background:var(--green-500)"></div>In Progress (${s.inProgress})</div>
      <div class="donut-legend-item"><div class="legend-dot" style="background:var(--border)"></div>Pending (${s.pending})</div>
    </div>
  `;
})();

/* ── LIVE CARD ─────────────────────────────────────────── */
(function () {
  const s = HUB_STATS;
  document.getElementById('live-card').innerHTML = `
    <div class="live-badge"><div class="live-dot"></div>Live System</div>
    <div class="live-title">System Ready</div>
    <div class="live-file">${s.total} Reports Synchronized</div>
    <div class="live-prog-label"><span>Status</span><span>100%</span></div>
    <div class="live-prog-bar"><div class="live-prog-fill"></div></div>
    <div class="live-pct">100%</div>
    <div class="live-controls">
      <button class="live-btn pause" onclick="alert('System operational.')">Status</button>
    </div>
  `;
})();
</script>
</body>
</html>
