<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datasets - Analysis Hub</title>
  <meta name="description" content="Manage and preview the datasets that power your analysis reports." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hub.css" />
  <style>
    .datasets-wrap { display: flex; flex-direction: column; gap: 20px; }
    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 4px; }
    @media (max-width: 900px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .stat-row { grid-template-columns: 1fr; } }

    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-card); padding: 18px 20px; box-shadow: var(--shadow);
    }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--text-500); margin-bottom: 6px; }
    .stat-num { font-size: 26px; font-weight: 800; color: var(--text-900); font-variant-numeric: tabular-nums; }
    .stat-sub { font-size: 11.5px; color: var(--text-400); margin-top: 4px; }

    .source-link {
      font-size: 12.5px; font-weight: 600; color: #1E6FA5; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px; transition: color .15s;
    }
    .source-link:hover { color: var(--green-700); text-decoration: underline; }

    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--r-card);
      padding: 32px 20px; text-align: center; background: var(--surface);
      transition: background .2s, border-color .2s; cursor: pointer;
    }
    .upload-zone:hover { background: var(--bg); border-color: var(--green-300); }
    .upload-title { font-size: 15px; font-weight: 700; color: var(--text-900); margin-bottom: 4px; }
    .upload-sub { font-size: 13px; color: var(--text-500); margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo"><div class="logo-name">Analysis Hub</div><div class="logo-sub">Data Reports</div></div>
    <div class="nav-section">
      <p class="nav-eyebrow">Menu</p>
      <a href="index.html"     class="nav-item" id="nav-dashboard"><span class="nav-label">Dashboard</span></a>
      <a href="reports.html"   class="nav-item" id="nav-reports">  <span class="nav-label">Reports</span><span class="nav-badge"></span></a>
      <a href="datasets.html"  class="nav-item active" id="nav-datasets"> <span class="nav-label">Datasets</span></a>
      <a href="analytics.html" class="nav-item" id="nav-analytics"><span class="nav-label">Analytics</span></a>
    </div>
    <div class="sidebar-spacer"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search datasets, sources, categories&hellip;" />
        <span class="search-kbd">&#8984;F</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="user-chip">
        <div class="user-text"><span class="user-name">Yash Vasudeva</span><span class="user-email">yash@analysis.hub</span></div>
        <div class="user-avatar">YV</div>
      </div>
    </header>

    <div class="page-header">
      <div class="page-header-text">
        <h1>Datasets</h1>
        <p>Manage, inspect, and access raw datasets that power your analysis reports.</p>
      </div>
    </div>

    <div class="content">
      <div class="datasets-wrap">

        <!-- Summary Stat Cards — auto-computed -->
        <div class="stat-row" id="ds-stat-row"></div>

        <!-- Repository banner -->
        <div class="upload-zone" style="cursor:default;" id="ds-banner"></div>

        <!-- Data Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Dataset Name</th>
                  <th>Category</th>
                  <th>Format</th>
                  <th>Size</th>
                  <th>Source Portal</th>
                  <th>Associated Report</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="dataset-list">
                <!-- JS injected -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="reports-data.js"></script>
<script src="hub.js"></script>
<script>
/* ── STAT CARDS ────────────────────────────────────────── */
(function () {
  const s = HUB_STATS;
  document.getElementById('ds-stat-row').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Active Datasets</div>
      <div class="stat-num">${s.total}</div>
      <div class="stat-sub">Fully ingested &amp; synced</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Data Size</div>
      <div class="stat-num">${s.totalSizeLabel}</div>
      <div class="stat-sub">30+ CSV, TXT &amp; archives</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Data Portals</div>
      <div class="stat-num">${s.portals.length}</div>
      <div class="stat-sub">${s.portals.join(', ')}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Linked Reports</div>
      <div class="stat-num">${s.total}</div>
      <div class="stat-sub">${REPORTS.map(r => r.categoryLabel).join(', ')}</div>
    </div>
  `;

  document.getElementById('ds-banner').innerHTML = `
    <p class="upload-title">Data Ingestion Repository</p>
    <p class="upload-sub">All ${s.total} active dataset sources are fully parsed, validated, and synchronized with report dashboards.</p>
  `;
})();

/* ── DATASET TABLE ─────────────────────────────────────── */
function renderDatasets(data) {
  const container = document.getElementById('dataset-list');
  if (!data.length) {
    container.innerHTML = `
      <tr>
        <td colspan="8" style="text-align: center; color: var(--text-400); padding: 36px;">
          No datasets match your search query.
        </td>
      </tr>
    `;
    return;
  }

  container.innerHTML = data.map(r => {
    const d = r.dataset;
    return `
      <tr data-search="${d.name} ${r.categoryLabel} ${d.format} ${d.sourceLabel} ${r.title}">
        <td style="font-weight: 700; color: var(--text-900);">
          ${d.name}
          <div style="font-size: 11px; color: var(--text-400); font-weight: normal; margin-top: 2px;">Ingested: ${r.updated}</div>
        </td>
        <td>
          <span style="font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; display:inline-block;
            background:${r.categoryColors.bg}; color:${r.categoryColors.text};">
            ${r.categoryLabel}
          </span>
        </td>
        <td><span class="badge" style="background:var(--bg);color:var(--text-500)">${d.format}</span></td>
        <td style="color:var(--text-500); font-weight:600;">${d.size}</td>
        <td>
          <a href="${d.sourceUrl}" target="_blank" rel="noopener" class="source-link">
            ${d.sourceLabel} &nearr;
          </a>
        </td>
        <td>
          <a href="${r.url}" style="font-size:12.5px; font-weight:600; color:var(--green-900); text-decoration:none;">
            ${r.title} &rarr;
          </a>
        </td>
        <td><span class="badge ${bClass(r.status)}">${bText(r.status)}</span></td>
        <td>
          <div style="display:flex; gap:6px;">
            <a href="${r.url}" class="btn-outline btn-xs" style="text-decoration:none;">View Report</a>
            <a href="${d.sourceUrl}" target="_blank" rel="noopener" class="btn-primary btn-xs" style="text-decoration:none;">Source Data</a>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

renderDatasets(REPORTS);

/* ── SEARCH ────────────────────────────────────────────── */
const searchInput = document.getElementById('search-input');
if (searchInput) {
  searchInput.addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = REPORTS.filter(r =>
      r.title.toLowerCase().includes(q) ||
      r.categoryLabel.toLowerCase().includes(q) ||
      r.dataset.format.toLowerCase().includes(q) ||
      r.dataset.name.toLowerCase().includes(q) ||
      r.dataset.sourceLabel.toLowerCase().includes(q) ||
      r.dataset.portal.toLowerCase().includes(q)
    );
    renderDatasets(filtered);
  });
}
</script>
</body>
</html>
